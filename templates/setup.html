<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置密码 · $title</title>
<link rel="icon" href="/static/icon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="centered">
<main class="authbox">
  <h1 class="auth-title">设置共用密码</h1>
  <p class="auth-sub">共用密码用于访问此入口下的服务。</p>
  $error_block
  <form method="post" action="/setup" class="stack">
    <input type="hidden" name="t" value="$setup_token">
    <label class="field">
      <span class="field-label">共用密码（至少 10 个字符）</span>
      <input type="password" name="password" autofocus autocomplete="new-password" required>
    </label>
    <label class="field">
      <span class="field-label">确认密码</span>
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn primary">保存密码并登录</button>
  </form>
</main>
</body>
</html>
