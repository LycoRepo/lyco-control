<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资源 · $title</title>
<link rel="icon" href="/static/icon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="bar-inner">
    <div class="brand"><a class="brand-link" href="/"><img class="brand-img" src="/static/icon-192.png" alt="" width="34" height="34" aria-hidden="true"><span class="brand-name">$title</span></a></div>
    <nav class="topnav" aria-label="主导航">
      <a class="navlink" href="/">入口</a>
      <a class="navlink" href="/admin">编辑</a>
      <a class="navlink" href="/logout">退出</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="hero-kicker">本机</p>
    <h1 class="hero-title">资源占用</h1>
  </section>

  <section class="stat-grid" aria-label="当前资源占用">
    <article class="stat-card">
      <p class="stat-label">CPU</p>
      <p class="stat-value"><span id="cpu">—</span><span class="stat-unit">%</span></p>
      <p class="stat-sub" id="load">负载 —</p>
    </article>
    <article class="stat-card">
      <p class="stat-label">内存</p>
      <p class="stat-value"><span id="mem">—</span><span class="stat-unit">%</span></p>
      <p class="stat-sub" id="mem-sub">—</p>
    </article>
    <article class="stat-card">
      <p class="stat-label">交换</p>
      <p class="stat-value"><span id="swap">—</span><span class="stat-unit">%</span></p>
      <p class="stat-sub" id="swap-sub">—</p>
    </article>
    <article class="stat-card">
      <p class="stat-label">磁盘</p>
      <p class="stat-value"><span id="disk">—</span><span class="stat-unit">%</span></p>
      <p class="stat-sub" id="disk-sub">—</p>
    </article>
  </section>

  <section class="chart-block" aria-label="趋势">
    <div class="chart-head">
      <h2 class="panel-title">最近 6 分钟</h2>
      <p class="panel-hint" id="stamp">—</p>
    </div>
    <div class="chart-row">
      <div class="chart-box">
        <p class="chart-title">CPU 与内存（%）</p>
        <canvas id="c-cpu" height="140"></canvas>
        <p class="chart-legend"><span class="lg lg-cpu"></span>CPU <span class="lg lg-mem"></span>内存</p>
      </div>
      <div class="chart-box">
        <p class="chart-title">网络（KB/s）</p>
        <canvas id="c-net" height="140"></canvas>
        <p class="chart-legend"><span class="lg lg-rx"></span>下行 <span class="lg lg-tx"></span>上行</p>
      </div>
    </div>
  </section>

  <p class="foot" id="foot">每 3 秒刷新 · 数据来自 /proc</p>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const state = { cpu: [], mem: [], rx: [], tx: [] };

  function fit(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 320, h = Number(canvas.getAttribute('height')) || 140;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  function draw(canvas, series, max) {
    const { ctx, w, h } = fit(canvas);
    ctx.clearRect(0, 0, w, h);
    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = Math.round(h * i / 4) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    const pad = 2;
    series.forEach(s => {
      const pts = s.data;
      if (pts.length < 2) return;
      ctx.beginPath();
      pts.forEach((v, i) => {
        const x = pad + (w - pad * 2) * (i / (pts.length - 1));
        const y = h - pad - (h - pad * 2) * Math.min(1, (v / s.max));
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      // 填充
      ctx.lineTo(w - pad, h - pad);
      ctx.lineTo(pad, h - pad);
      ctx.closePath();
      ctx.fillStyle = s.fill;
      ctx.fill();
    });
  }

  function push(arr, v) { arr.push(v); if (arr.length > 120) arr.shift(); }

  async function tick() {
    try {
      const r = await fetch('/api/metrics', { credentials: 'same-origin' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      $('cpu').textContent = d.cpu.toFixed(0);
      $('load').textContent = '负载 ' + d.load.map(x => x.toFixed(2)).join(' / ');
      $('mem').textContent = d.mem_pct.toFixed(0);
      $('mem-sub').textContent = d.mem.used_mb + ' / ' + d.mem.total_mb + ' MB（可用 ' + d.mem.avail_mb + ' MB）';
      $('swap').textContent = d.swap_pct.toFixed(0);
      $('swap-sub').textContent = d.mem.swap_total_mb ? (d.mem.swap_used_mb + ' / ' + d.mem.swap_total_mb + ' MB') : '未启用';
      $('disk').textContent = d.disk.pct.toFixed(0);
      $('disk-sub').textContent = d.disk.used_gb + ' / ' + d.disk.total_gb + ' GB（剩 ' + d.disk.free_gb + ' GB）';
      $('stamp').textContent = '运行 ' + d.uptime_h + ' 小时 · 更新于 ' + new Date(d.ts * 1000).toLocaleTimeString();

      // 用服务端历史做首屏，之后本地追加
      if (state.cpu.length === 0 && Array.isArray(d.history)) {
        d.history.forEach(h => { push(state.cpu, h.cpu); push(state.mem, h.mem_pct); push(state.rx, h.rx_kbs); push(state.tx, h.tx_kbs); });
      } else {
        push(state.cpu, d.cpu); push(state.mem, d.mem_pct); push(state.rx, d.rx_kbs); push(state.tx, d.tx_kbs);
      }

      draw($('c-cpu'), [
        { data: state.cpu, max: 100, color: '#e05a72', fill: 'rgba(224,90,114,0.12)' },
        { data: state.mem, max: 100, color: '#6ea8fe', fill: 'rgba(110,168,254,0.10)' }
      ]);
      const netMax = Math.max(64, ...state.rx, ...state.tx) * 1.15;
      draw($('c-net'), [
        { data: state.rx, max: netMax, color: '#3ecf8e', fill: 'rgba(62,207,142,0.10)' },
        { data: state.tx, max: netMax, color: '#e0a35a', fill: 'rgba(224,163,90,0.10)' }
      ]);
    } catch (e) {
      $('foot').textContent = '取数据失败：' + e.message;
    }
  }

  tick();
  setInterval(tick, 3000);
  window.addEventListener('resize', () => tick());
})();
</script>
</body>
</html>
