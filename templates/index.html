<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$title</title>
<link rel="icon" href="/static/icon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="bar-inner">
    <div class="brand"><img class="brand-img" src="/static/icon-192.png" alt="" width="34" height="34" aria-hidden="true"><span class="brand-name">$title</span></div>
    <nav class="topnav" aria-label="主导航">
      <a class="navlink" href="/admin">打开设置</a>
      <form method="post" action="/logout" class="navform"><button type="submit" class="navlink">退出登录</button></form>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <p class="hero-kicker">服务门户</p>
    <h1 class="hero-title" id="page-title">服务入口</h1>
  </section>

  <section class="grid" aria-label="服务入口">
$cards
  </section>

$stats_strip


  <section class="panel" aria-labelledby="chart-title">
    <div class="panel-heading">
      <h2 class="panel-title" id="chart-title">资源趋势</h2>
      <p class="panel-hint"><span id="span">正在收集数据</span> · <span id="stamp" role="status">—</span></p>
    </div>
    <div class="chart-row three">
      <div class="chart-box">
        <p class="chart-title">CPU 使用率（%）</p>
        <div class="chart-plot"><div class="chart-y" aria-hidden="true"><span id="y-top-1">—</span><span id="y-mid-1">—</span><span id="y-bot-1">0</span></div><canvas id="c-cpu" height="120" role="img" aria-label="CPU 使用率趋势">请查看资源概览数值。</canvas></div>
        <p class="chart-axis"><span id="ax-left-1">—</span><span id="ax-mid-1">—</span><span id="ax-right-1">现在</span></p>
      </div>
      <div class="chart-box">
        <p class="chart-title">内存使用率（%）</p>
        <div class="chart-plot"><div class="chart-y" aria-hidden="true"><span id="y-top-2">—</span><span id="y-mid-2">—</span><span id="y-bot-2">0</span></div><canvas id="c-mem" height="120" role="img" aria-label="内存使用率趋势">请查看资源概览数值。</canvas></div>
        <p class="chart-axis"><span id="ax-left-2">—</span><span id="ax-mid-2">—</span><span id="ax-right-2">现在</span></p>
      </div>
      <div class="chart-box">
        <p class="chart-title">网络速率（KiB/s）</p>
        <div class="chart-plot"><div class="chart-y" aria-hidden="true"><span id="y-top-3">—</span><span id="y-mid-3">—</span><span id="y-bot-3">0</span></div><canvas id="c-net" height="120" role="img" aria-label="网络速率趋势">请查看资源概览数值。</canvas></div>
        <p class="chart-axis"><span id="ax-left-3">—</span><span id="ax-mid-3">—</span><span id="ax-right-3">现在</span></p>
        <p class="chart-legend"><span class="lg lg-rx"></span>下行 <span class="lg lg-tx"></span>上行</p>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="svc-title">
    <div class="panel-heading">
      <h2 class="panel-title" id="svc-title">服务资源占用</h2>
      <p class="panel-hint">包含服务和容器，按内存占用排序。</p>
    </div>
    <div class="table-scroll" tabindex="0" role="region" aria-label="服务资源占用表格">
      <table class="table svc-table">
        <caption class="sr-only">服务和容器的资源占用</caption>
        <thead><tr><th scope="col">名称</th><th scope="col">内存</th><th scope="col">CPU</th></tr></thead>
        <tbody id="svc-rows"><tr><td colspan="3" class="panel-hint">正在读取数据</td></tr></tbody>
      </table>
    </div>
  </section>

  <footer class="foot">探活时间：<time>$when</time></footer>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const s = { cpu: [], mem: [], rx: [], tx: [], ts: [] };
  if (!$('c-cpu')) return;

  const H = 120;   // 逻辑高度固定：绝不能再从 canvas 属性里读（那会被自己越写越大）

  function fit(c) {
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth || 260;
    c.style.height = H + 'px';          // CSS 高度钉死
    c.width = Math.round(w * dpr);      // 仅后备缓冲按 DPR 放大
    c.height = Math.round(H * dpr);
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h: H };
  }
  function draw(c, series, axisMax, unit, t0, t1) {
    const { ctx, w, h } = fit(c);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const y = Math.round(h * i / 3) + .5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    // 纵轴刻度用左侧的 HTML 文字显示（canvas 里的小字太糊）
    const fmt = v => (v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v)));
    if (c.dataset.axis !== String(axisMax) + (unit || '')) {
      const n = c.id.replace('c-', '');
      const idx = { cpu: 1, mem: 2, net: 3 }[n];
      const put = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = fmt(v) + (unit || ''); };
      put('y-top-' + idx, axisMax); put('y-mid-' + idx, axisMax / 2); put('y-bot-' + idx, 0);
      c.dataset.axis = String(axisMax) + (unit || '');
    }
    const pad = 2;
    const span = Math.max(1, t1 - t0);
    const xAt = ts => pad + (w - pad * 2) * Math.min(1, Math.max(0, (ts - t0) / span));
    series.forEach(x => {
      const pts = x.data, ts = x.ts || [];
      if (pts.length < 2) return;
      ctx.beginPath();
      pts.forEach((v, i) => {
        const px = xAt(ts[i] ?? t1);
        const py = h - pad - (h - pad * 2) * Math.min(1, v / x.max);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.strokeStyle = x.color; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.lineTo(xAt(ts[pts.length - 1] ?? t1), h - pad);
      ctx.lineTo(xAt(ts[0] ?? t0), h - pad);
      ctx.closePath();
      ctx.fillStyle = x.fill; ctx.fill();
    });
  }
  function renderServices(list) {
    const tb = $('svc-rows');
    if (!Array.isArray(list) || !list.length) {
      tb.innerHTML = '<tr><td colspan="3">暂无服务占用数据</td></tr>';
      return;
    }
    const escapeText = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const maxMem = Math.max.apply(null, list.map(x => x.mem_mb).concat([1]));
    tb.innerHTML = list.map(x => {
      const pct = Math.max(2, Math.round(100 * x.mem_mb / maxMem));
      const cpu = x.cpu.toFixed(1) + '%';
      const mem = x.mem_mb.toFixed(1) + ' MB · ' + (x.mem_pct ?? 0).toFixed(1) + '%';
      const kind = x.kind === 'container' ? '容器' : '服务';
      return '<tr><td><span class="svc-name">' + escapeText(x.name) + '</span><span class="svc-kind">' + kind + '</span>'
        + '<span class="svc-bar" style="width:' + pct + '%"></span></td>'
        + '<td class="svc-num">' + mem + '</td>'
        + '<td class="svc-num">' + cpu + '</td></tr>';
    }).join('');
  }

  let fetching = false;
  async function tick() {
    if (fetching) return;
    fetching = true;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const r = await fetch('/api/metrics', { credentials: 'same-origin', signal: controller.signal });
      if (r.status === 401 || r.redirected) {
        $('stamp').textContent = '会话已失效，请重新登录';
        return;
      }
      if (!r.ok) throw new Error('资源数据暂不可用');
      const d = await r.json();

      $('stamp').textContent = '已运行 ' + d.uptime_h + ' 小时 · 更新于 ' + new Date(d.ts * 1000).toLocaleTimeString() + (d.degraded ? ' · 数据可能延迟' : '');

      const hist = Array.isArray(d.history) ? d.history : [];
      const clock = ts => {
        const dt = new Date(ts * 1000);
        const hh = String(dt.getHours()).padStart(2, '0');
        const mm = String(dt.getMinutes()).padStart(2, '0');
        if (winSec < 120) return hh + ':' + mm + ':' + String(dt.getSeconds()).padStart(2, '0');
        if (winSec >= 20 * 3600) return (dt.getMonth() + 1) + '-' + dt.getDate() + ' ' + hh + ':' + mm;
        return hh + ':' + mm;
      };
      const human = sec => {
        if (sec < 90) return Math.round(sec) + ' 秒';
        if (sec < 3600) return Math.round(sec / 60) + ' 分钟';
        const h = sec / 3600;
        return (h >= 10 ? Math.round(h) : h.toFixed(1)) + ' 小时';
      };
      // 完整使用后端窗口，当前桶均值、断线补点、模式切换和淘汰都会立即反映。
      s.ts = hist.map(h => h.ts);
      s.cpu = hist.map(h => h.cpu);
      s.mem = hist.map(h => h.mem_pct);
      s.rx = hist.map(h => h.rx_kbs);
      s.tx = hist.map(h => h.tx_kbs);
      $('c-cpu').setAttribute('aria-label', 'CPU 当前使用率 ' + d.cpu + '%');
      $('c-mem').setAttribute('aria-label', '内存当前使用率 ' + d.mem_pct + '%');
      $('c-net').setAttribute('aria-label', '下行 ' + d.rx_kbs + ' KiB/s，上行 ' + d.tx_kbs + ' KiB/s');

      // 横轴不预留未来：从第一个点画到最后一个点，跨度就是已存到的时间
      const have = s.ts.length;
      const t0 = have ? s.ts[0] : d.ts;
      const t1 = have ? s.ts[have - 1] : d.ts;
      const winSec = Math.max(0, t1 - t0);
      const spanSec = winSec;
      $('span').textContent = have < 2 ? '正在收集数据' : '最近 ' + human(spanSec);
      const labels = [clock(t0), clock(Math.round((t0 + t1) / 2)), clock(t1)];
      ['1', '2', '3'].forEach(k => {
        $('ax-left-' + k).textContent = labels[0];
        $('ax-mid-' + k).textContent = labels[1];
        $('ax-right-' + k).textContent = labels[2];
      });

      draw($('c-cpu'), [{ data: s.cpu, ts: s.ts, max: 100, color: '#e05a72', fill: 'rgba(224,90,114,0.12)' }], 100, '%', t0, t1);
      draw($('c-mem'), [{ data: s.mem, ts: s.ts, max: 100, color: '#6ea8fe', fill: 'rgba(110,168,254,0.10)' }], 100, '%', t0, t1);
      // 网络纵轴取整到好看的档（10/20/50/100…），避免出现 74 这种怪刻度
      const NICE = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
      const peak = Math.max.apply(null, s.rx.concat(s.tx).concat([0]));
      const netMax = NICE.find(v => v >= peak * 1.15) || Math.ceil(peak * 1.15 / 10000) * 10000;
      draw($('c-net'), [
        { data: s.rx, ts: s.ts, max: netMax, color: '#3ecf8e', fill: 'rgba(62,207,142,0.10)' },
        { data: s.tx, ts: s.ts, max: netMax, color: '#e0a35a', fill: 'rgba(224,163,90,0.10)' }
      ], netMax, '', t0, t1);

      renderServices(d.services);
    } catch (e) {
      $('stamp').textContent = '资源数据更新失败，稍后自动重试';
    } finally {
      clearTimeout(timeout);
      fetching = false;
    }
  }
  tick(); setInterval(tick, 3000);
  window.addEventListener('resize', tick);
})();
</script>
</body>
</html>
