# /etc/nginx/sites-available/lyco-control
# 一个入口 + 若干门牌（子域）。把 example.com 换成你自己的域，把 map 里的端口换成真实端口。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录限速（第二道闸）。只对 POST 计数：GET 登录页不计入，否则连刷新几下就被挡。
map $request_method $login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_key zone=login:10m rate=20r/m;

map $host $backend {
    app1.example.com   http://127.0.0.1:8080;
    app2.example.com   http://127.0.0.1:9090;
}

# 入口页：登录 / 卡片 / 编辑 / 详情
server {
    listen 80;
    server_name panel.example.com;

    # 登录接口限速：超过就退回登录页并提示，不是一屏 nginx 默认错误
    location = /login {
        limit_req zone=login burst=8 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        client_max_body_size 256k;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        # 覆盖写：客户端自带的同名头会被替换，应用只认这个
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_many {
        return 302 /login?slow=1;
    }

    location / {
        client_max_body_size 256k;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:7900;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 受保护的面板：先问门户有没有登录态，没登录就踢回登录页
server {
    listen 80;
    server_name app1.example.com app2.example.com;

    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:7900/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
    }

    location @login {
        return 302 $scheme://panel.example.com/login;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;

        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Client-IP       $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 面板里常有长轮询 / 日志流
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
